name: Android release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Signing secrets are scoped to the steps that need them. As job-level
    # environment they were readable by every step, including third-party
    # actions and the dependency build hooks run by `flutter pub get`.

    steps:
      - name: Checkout
        # Actions are pinned to the commit their major tag pointed to: a moved
        # tag cannot inject code into a job that handles signing material.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing pushes from this job; do not leave the token in .git.
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.WILDBIT_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/wildbit-release.jks"
          test -s "$RUNNER_TEMP/wildbit-release.jks"
          echo "WILDBIT_RELEASE_STORE_FILE=$RUNNER_TEMP/wildbit-release.jks" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: dart analyze

      - name: Test
        run: flutter test

      - name: Release preflight
        env:
          WILDBIT_RELEASE_STORE_PASSWORD: ${{ secrets.WILDBIT_RELEASE_STORE_PASSWORD }}
          WILDBIT_RELEASE_KEY_ALIAS: ${{ secrets.WILDBIT_RELEASE_KEY_ALIAS }}
          WILDBIT_RELEASE_KEY_PASSWORD: ${{ secrets.WILDBIT_RELEASE_KEY_PASSWORD }}
        run: dart run tool/check_release.dart --strict

      - name: Build signed Android App Bundle
        env:
          WILDBIT_RELEASE_STORE_PASSWORD: ${{ secrets.WILDBIT_RELEASE_STORE_PASSWORD }}
          WILDBIT_RELEASE_KEY_ALIAS: ${{ secrets.WILDBIT_RELEASE_KEY_ALIAS }}
          WILDBIT_RELEASE_KEY_PASSWORD: ${{ secrets.WILDBIT_RELEASE_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload App Bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wildbit-android-release
          path: build/app/outputs/bundle/release/app-release.aab

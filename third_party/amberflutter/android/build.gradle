group 'com.sebdeveloper6952.amberflutter.amberflutter'
version '1.0-SNAPSHOT'

apply plugin: 'com.android.library'

android {
    namespace 'com.sebdeveloper6952.amberflutter.amberflutter'
    compileSdk 37

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdk 19
    }

    dependencies {
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.0.0'
    }
}

// AGP 9 compiles Kotlin through its built-in Kotlin support; do not apply the
// legacy Kotlin Gradle Plugin from this library.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
